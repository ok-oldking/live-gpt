[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "live-gpt"
version = "0.1.0"
description = "Voice and screen-sharing chat for web chatbots"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "playwright",
    "PySide6-Essentials",
    "sherpa-onnx",
    "sounddevice",
]

[project.gui-scripts]
live-gpt = "live_gpt.app:main"

[tool.setuptools.package-data]
live_gpt = ["assets/*.ico", "assets/*.png", "assets/*.svg"]
